{{PAGEHEAD}}

<section class="contact-wrap" aria-label="Contact form">
  <form class="brief" autocomplete="on">
    <p class="brief__q mono">I need help with (pick any)</p>
    <div class="chips">
      <button type="button" class="chip" data-chip="website" aria-pressed="false">Website</button>
      <button type="button" class="chip" aria-pressed="false">Web app</button>
      <button type="button" class="chip" aria-pressed="false">SEO</button>
      <button type="button" class="chip" aria-pressed="false">AI &amp; automation</button>
      <button type="button" class="chip" aria-pressed="false">Branding &amp; UI/UX</button>
      <button type="button" class="chip" aria-pressed="false">Redesign</button>
    </div>
    <div class="brief__row">
      <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" autocomplete="name" placeholder="Jane Doe" /></div>
      <div class="field"><label for="f-biz">Business</label><input id="f-biz" name="business" type="text" autocomplete="organization" placeholder="Your business or website" /></div>
    </div>
    <div class="field"><label for="f-msg">About your project</label><textarea id="f-msg" name="msg" rows="4" placeholder="What do you want to build, and by when?"></textarea></div>
    <div class="brief__send">
      <button type="submit" class="btn-pill" value="whatsapp"><span>Send on WhatsApp</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
      <button type="submit" class="btn-pill btn-pill--ghost" value="email"><span>Send by email</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
    </div>
  </form>

  <aside class="contact-side" aria-label="Direct contact">
    <a href="https://wa.me/919057582885" target="_blank" rel="noopener" class="contact-card" data-reveal><span class="mono">WhatsApp</span><strong>+91 90575 82885</strong></a>
    <a href="tel:+919057582885" class="contact-card" data-reveal><span class="mono">Call</span><strong>+91 90575 82885</strong></a>
    <a href="tel:+919950696939" class="contact-card" data-reveal><span class="mono">Call</span><strong>+91 99506 96939</strong></a>
    <a href="mailto:hello@turningwave.in" class="contact-card" data-copy="hello@turningwave.in" data-cursor="Copy" data-reveal><span class="mono">Email · click to copy</span><strong>hello@turningwave.in</strong></a>
    <div class="contact-card" data-reveal><span class="mono">Location</span><strong>India · working worldwide</strong></div>
    <div class="contact-card" data-reveal><span class="mono">Reply time</span><strong>Within 24 hours</strong></div>
  </aside>
</section>

<section class="process-sect" aria-labelledby="process-title">
  <div class="process-sect__head">
    <p class="label mono"><span>( 02 )</span> What happens next</p>
    <h2 class="h2" id="process-title" data-split-lines>From message<br />to <em class="serif grad-text">launch</em></h2>
  </div>
  {{PROCESS}}
</section>
